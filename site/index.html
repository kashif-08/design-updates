<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixel Post · app design changes worth your time</title>
    <meta name="description" content="A one-person morning paper of design, flow and feature changes in popular apps." />
    <meta name="theme-color" content="#f3efe6" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Geist:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Set the theme and language before first paint so neither flashes.
      try {
        const t = localStorage.getItem('radar.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        const l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('radar.lang');
        if (l === 'zh') document.documentElement.lang = 'zh-CN';
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip" href="#today">Skip to today</a>
    <div class="page">
      <header class="masthead">
        <div class="masthead-row">
          <a class="wordmark" href="./" aria-label="Pixel Post, home">
            <span class="logo" id="logo" aria-hidden="true"></span>
            <span class="wordmark-text">Pixel Post</span>
          </a>
          <p class="masthead-meta" id="issue"></p>
          <button class="digest-btn" id="digest" type="button"><span class="star" aria-hidden="true"></span><span class="label">Digest</span><span class="n" hidden></span></button>
          <button class="lang-toggle" id="lang" type="button" aria-label="切换到中文" lang="zh-CN">中</button>
          <button class="theme-toggle" id="theme" type="button" aria-label="Switch to dark mode"></button>
        </div>
        <div class="rule rule-heavy" aria-hidden="true"></div>
      </header>

      <main>
        <section class="hello" aria-labelledby="greeting">
          <h1 id="greeting" class="hello-title"></h1>
          <p id="summary" class="hello-summary" aria-live="polite"></p>
        </section>

        <section id="today" class="today" aria-label="Today"></section>

        <section class="archive" aria-labelledby="archive-title">
          <div class="archive-head">
            <h2 id="archive-title" class="section-title">Earlier</h2>
            <div class="filters" id="filters" role="group" aria-label="Filter earlier changes"></div>
          </div>
          <div id="archive"></div>
        </section>
      </main>

      <footer class="footer" id="footer"></footer>
    </div>
    <dialog id="digest-dialog" class="digest" aria-labelledby="digest-title"><div id="digest-box"></div></dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
