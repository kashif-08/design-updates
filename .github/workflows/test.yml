name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'watchlist.yaml', 'package.json']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
