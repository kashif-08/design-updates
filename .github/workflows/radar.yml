name: Publish page

# Collecting happens on the laptop every morning (scripts/daily.sh, with the company Claude), which uploads data/.
# This only builds the static site and publishes it to GitHub Pages. While building, it copies app icons into the
# site so the page does not depend on Google's and Apple's image servers.

on:
  push:
    branches: [main]
    paths: ['data/**', 'site/**', 'src/**', 'watchlist.yaml']
  # "Run workflow" button on the Actions tab, to republish by hand.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
